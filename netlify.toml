# Netlify récupère le code sur GitHub, régénère js/app.bundle.js puis publie le dossier.
[build]
  publish = "."
  command = "npm run build"

# Le service worker et la page doivent toujours être relus pour que les mises à jour arrivent.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
